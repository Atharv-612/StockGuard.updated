spring.application.name=StockGuard
server.port=${PORT:8080}

# ---------- MySQL ----------
# The database is created automatically on first start. Change the user/password here
# or set the DB_USERNAME / DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stockguard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Security ----------
# Use a long random value in production (at least 32 characters).
stockguard.jwt.secret=${JWT_SECRET:change-me-stockguard-secret-key-please-use-a-long-random-string}
stockguard.jwt.expiration-hours=24

# ---------- Alerts ----------
# Daily digest of expiring / expired / low-stock items (sec min hour day month weekday).
stockguard.alerts.cron=${ALERT_CRON:0 0 9 * * *}
stockguard.alerts.zone=${ALERT_ZONE:Asia/Kolkata}

