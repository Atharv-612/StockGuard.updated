# Quick demo without MySQL: in-memory H2 database (data is lost on restart).
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:mem:stockguard;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
stockguard.demo-data=true
